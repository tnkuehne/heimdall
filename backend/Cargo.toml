[package]
name = "meeting-recorder"
version = "0.5.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
async-io = "2.6"
blocking = "1.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
gio = "0.22.8"
keyring-core = "1.0.0"
nix = { version = "0.29", features = ["process", "signal"] }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "multipart", "json", "query", "rustls"] }
rpassword = "7.5.2"
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zbus = "5.19"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-async-io-crypto-rust"] }
zeroize = "1.8"
